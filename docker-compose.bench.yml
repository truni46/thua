services:
  model:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.23.0@sha256:6d8429e38e3747723ca07ee1b17972e09bb9c51c4032b266f24fb1cc3b22ed8f}
    entrypoint:
      - python3
      - -m
      - vllm.entrypoints.openai.api_server
    command:
      - --model=${MODEL:-LiquidAI/LFM2.5-1.2B-Instruct}
      - --served-model-name=LFM2.5-1.2B-Instruct
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=${MAX_MODEL_LEN:-6144}
      - --dtype=bfloat16
      - --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION:-0.9}
      - --tensor-parallel-size=1
      - --enable-prefix-caching
      - --kv-cache-dtype=${KV_CACHE_DTYPE:-auto}
      - --enable-chunked-prefill
      - --max-num-batched-tokens=${MAX_NUM_BATCHED_TOKENS:-4096}
      - --max-num-seqs=${MAX_NUM_SEQS:-16}
      - --max-num-partial-prefills=${MAX_NUM_PARTIAL_PREFILLS:-1}
      - --scheduling-policy=${SCHEDULING_POLICY:-fcfs}
      - --no-enable-log-requests
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_ATTENTION_BACKEND=${ATTN_BACKEND:-}
    shm_size: "2g"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 600s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    depends_on:
      model:
        condition: service_healthy
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - ./trace_grading_public.jsonl:/harness/trace_grading_public.jsonl:ro
      - ./grading-workload-spec.json:/harness/grading-workload-spec.json:ro
    command: ["${BENCH:-speed}", "--config", "configs/experiment/lfm2_docker.yaml"]
